<!doctype html>

     see here is what the profile will do. Reload to replay the animation. -->
<style>
  body{background:#010409;color:#7d8590;font:13px ui-monospace,Menlo,monospace;
       margin:0;padding:48px 16px;display:flex;flex-direction:column;
       align-items:center;gap:10px}
  h3{color:#c9d1d9;font-weight:600;margin:26px 0 10px}
  code{color:#39d353}
  table{border-spacing:0}
  td{vertical-align:top;padding:0}

         border-radius:6px;padding:7px 14px;font:inherit;cursor:pointer}
